name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # كتابة المحتوى لازم فقط لخطوة نشر نسخة المعاينة (تُشترط بوجود .ci/publish-demo)
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Guard invariants (no destructive migration, no debug-signed release, fixed identity)
        run: ./tools/ci_invariants.sh

      # اختبار لوحة الأدمن: يحمّل كتلة بناء DOM الآمن من اللوحة نفسها ويرمي عليها حمولات XSS
      # حقيقية، ثم يسأل الشجرة: هل وُلد وسم؟ هل ارتبط إجراء بنصّ؟ (SEC-04 — ح١٢)
      - name: Guard admin console (XSS payloads render as text)
        run: |
          if command -v node >/dev/null 2>&1; then
            node tools/admin_console_test.mjs
          else
            echo "::warning title=ADMIN::بيئة بلا node — تُخطّى الاختبارات الديناميكية للوحة (الحاجز الثابت يعمل)"
          fi

      # اختبار موقّع التصاريح: يوقّع الحمولة بكتلة اللوحة نفسها (WebCrypto) ثم يتحقق منها بمكتبة
      # Node مستقلة، ويتأكد أن صيغة الحقول والترميز مطابقة لما يقرأه التطبيق (ح١٣ — LIC-01)
      - name: Guard license signer (browser token verifies independently)
        run: |
          if command -v node >/dev/null 2>&1; then
            node tools/license_signer_test.mjs
          else
            echo "::warning title=LICENSE::بيئة بلا node — يُخطّى اختبار الموقّع (ويبقى اختبار المتجه الذهبي في Kotlin)"
          fi

      # فحص سجلّ التوزيع (ح٢١): رقم الإصدار لم يُوزَّع قبله، ولا مفتاحان في السجلّ.
      - name: Guard the release log (ح٢١)
        run: |
          if command -v node >/dev/null 2>&1; then
            node tools/release_check.mjs --check
          else
            echo "::warning title=RELEASE::بيئة بلا node — يُخطّى فحص سجلّ التوزيع"
          fi

      # اختبار قناة الإصدار (ح٢٠): يولّد ملفًّا موقّعًا بأداة المالك، ويتحقق منه بمكتبة مستقلة،
      # ويؤكد أن متجهات اختبارات Kotlin هي ما تنتجه الأداة الآن — فلا تنفصل النسختان.
      - name: Guard release channel tooling (signed manifest round-trip)
        run: |
          if command -v node >/dev/null 2>&1; then
            node tools/release_test.mjs
          else
            echo "::warning title=UPDATE::بيئة بلا node — يُخطّى اختبار أدوات الإصدار (ويبقى اختبار المتجهات في Kotlin)"
          fi

      # حاجز بنية قواعد Firestore: يعمل بلا شبكة ولا محاكي، ويكشف القراءة العامة (`if true`)
      # واختفاء حالات §8.2 من المصفوفة (ح١٥)
      - name: Guard Firestore rules structure (deny-by-default, §8.2 matrix present)
        run: |
          if command -v node >/dev/null 2>&1; then
            node tools/rules_guard.mjs
          else
            echo "::warning title=RULES::بيئة بلا node — يُخطّى الحاجز البنيوي (ويبقى الحاجز النصّي في ci_invariants)"
          fi

      # مصفوفة قواعد Firestore على المحاكي الحقيقي: ٣٥ حالة رفض وشواهد سماح (ح١٥، §8.2)
      - name: Install Firestore rules tooling (emulator + rules test kit)
        id: rules_tools
        continue-on-error: true
        run: |
          npm install --prefix tools --no-audit --no-fund 2>&1 | tail -5

      - name: Firestore rules matrix (on the emulator)
        id: rules_matrix
        continue-on-error: true
        run: |
          if [ ! -x tools/node_modules/.bin/firebase ]; then
            echo "::error title=rules::أدوات المحاكي غير مثبّتة — تعذّر تشغيل مصفوفة §8.2 لقواعد Firestore"
            exit 1
          fi
          set -o pipefail
          tools/node_modules/.bin/firebase emulators:exec --only firestore --project demo-baynana \
            "node tools/firestore_rules_test.mjs" 2>&1 | tee /tmp/rules_matrix.log

      - name: Report rules matrix failures
        if: steps.rules_matrix.outcome == 'failure'
        run: |
          # الدليل على الفشل سطر المصفوفة نفسه: كل حالة فاشلة تُطبع ببادئة «⛔ error:» وفيها اسمها
          # وسببها (انظر `reportFailure` في tools/firestore_rules_test.mjs)، والنجاح 🚫 فلا يختلط بالفشل.
          #
          # تحذير تشغيلي مقصود: عدد التعليقات (annotations) التي يقبلها GitHub لكل خطوة محدود، فقد
          # سبق أن ابتلعت تعليقات النجاح الميزانية فبقي التشغيل الأحمر بلا اسم حالة. لذلك نُرتّب
          # الأولويات: سطر الفشل أولًا، ثم سبب الخروج، ثم آخر السجل — بميزانية مضبوطة.
          while IFS= read -r line; do
            echo "::error title=rules::$line"
          done < <(grep -nE "⛔|AssertionError|Expected|missing|❌" /tmp/rules_matrix.log | head -3 || true)
          while IFS= read -r line; do
            echo "::error title=rules-exception::$line"
          done < <(grep -nE "Error|error|Unhandled|FATAL|exited" /tmp/rules_matrix.log \
            | grep -vE "@firebase/firestore" | head -2 || true)
          while IFS= read -r line; do
            echo "::error title=rules-tail::$line"
          done < <(tail -5 /tmp/rules_matrix.log || true)
          echo "=== آخر 40 سطرًا ==="
          tail -40 /tmp/rules_matrix.log

      # الخطوات التالية تُبقي خرج Gradle في ملف، ثم تُعلن الأخطاء كتعليقات (annotations) على
      # الدفعة. السبب: تفاصيل الأخطاء يجب أن تكون مقروءة من واجهة الفحص دون تنزيل سجلات كاملة،
      # وهذا ما تعتمد عليه المراجعة الآلية في هذه المرحلة.
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/gradle_test.log

      - name: Report unit test failures
        if: steps.unit_tests.outcome == 'failure'
        run: |
          echo "=== أخطاء الترجمة ==="
          grep -nE "^e: |^error:" /tmp/gradle_test.log | head -25 || true
          while IFS= read -r line; do
            echo "::error title=compile::$line"
          done < <(grep -nE "^e: |^error:" /tmp/gradle_test.log | head -20 || true)

          # أسماء الاختبارات الفاشلة وسببها، سطر لكل اختبار. تقارير JUnit XML هي المصدر.
          echo "=== الاختبارات الفاشلة ==="
          python3 - <<'PY' || true
          import glob, re, sys, xml.etree.ElementTree as ET

          def clean(text: str, limit: int = 400) -> str:
              text = " ".join((text or "").split())
              return text[:limit]

          found = 0
          for path in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              try:
                  root = ET.parse(path).getroot()
              except Exception as error:  # noqa: BLE001
                  print(f"::warning title=report::تعذّر قراءة {path}: {error}")
                  continue
              for case in root.iter("testcase"):
                  failure = case.find("failure")
                  error = case.find("error")
                  node = failure if failure is not None else error
                  if node is None:
                      continue
                  found += 1
                  name = f"{case.get('classname', '?')}.{case.get('name', '?')}"
                  message = clean(node.get("message") or node.text or "بلا رسالة")
                  print(f"::error title={name}::{message}")
          if found == 0:
              print("لم يُعثر على اختبار فاشل في التقارير؛ راجع آخر السجل.")
              print(clean(open("/tmp/gradle_test.log", encoding="utf-8", errors="replace").read()[-2000:]))
          PY
          echo "=== آخر 20 سطرًا ==="
          tail -20 /tmp/gradle_test.log

      - name: Lint (fails the build on errors)
        id: lint
        if: steps.unit_tests.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --stacktrace 2>&1 | tee /tmp/gradle_lint.log

      - name: Report lint failures
        if: steps.lint.outcome == 'failure'
        run: |
          grep -nE "Error:|error:|What went wrong|Execution failed" /tmp/gradle_lint.log | head -20 || true
          while IFS= read -r line; do
            echo "::error title=lint::$line"
          done < <(grep -nE "Error:|What went wrong|Execution failed" /tmp/gradle_lint.log | head -20 || true)
          echo "=== آخر 30 سطرًا ==="
          tail -30 /tmp/gradle_lint.log

      - name: Assemble debug APK
        id: assemble
        if: steps.unit_tests.outcome == 'success' && steps.lint.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee /tmp/gradle_assemble.log

      - name: Report assemble failures
        if: steps.assemble.outcome == 'failure'
        run: |
          while IFS= read -r line; do
            echo "::error title=assemble::$line"
          done < <(grep -nE "^e: |error:|What went wrong|Execution failed|> Task .*FAILED" /tmp/gradle_assemble.log | head -20 || true)
          tail -30 /tmp/gradle_assemble.log

      # عند وجود الملف .ci/dump-schemas: يُعلن محتوى مخططات Room المولّدة كتعليقات مشفّرة
      # base64، لأن تنزيل artifacts قد لا يكون متاحًا. يُستخدم مرة واحدة لحفظ المخطط في
      # المستودع ثم يُحذف الملف. الخطوة تُنهي نفسها فورًا عند غياب الملف.
      - name: Dump Room schemas (only when .ci/dump-schemas exists)
        run: |
          if [ ! -f .ci/dump-schemas ]; then
            echo "تخطي استخراج المخططات: لا يوجد .ci/dump-schemas"
            exit 0
          fi
          python3 - <<'PY'
          import base64, glob, gzip

          files = sorted(glob.glob("app/schemas/**/*.json", recursive=True))
          if not files:
              print("::warning title=SCHEMA|none::لم يُنتج البناء أي مخطط في app/schemas")
          for path in files:
              text = open(path, encoding="utf-8").read()
              # gzip ثم base64: مخطط Room نصي متكرر فتقليصه إلى سدس حجمه يجعله يدخل في
              # عدد الأجزاء المسموح. ورسالة التعليق تُقتطع عند 4096 حرفًا، فنقسم على 4000.
              encoded = base64.b64encode(gzip.compress(text.encode("utf-8"))).decode("ascii")
              chunk_size = 4000
              parts = [encoded[i:i + chunk_size] for i in range(0, len(encoded), chunk_size)] or [""]
              for index, part in enumerate(parts, start=1):
                  print(f"::warning title=SCHEMA|{path.replace('app/schemas/', '')}|{index}/{len(parts)}::{part}")
          print(f"::warning title=SCHEMA|FILES::{'|'.join(files) if files else 'none'}")
          PY

      - name: Fail the job if any stage failed
        if: steps.unit_tests.outcome != 'success' || steps.lint.outcome == 'failure' || steps.assemble.outcome == 'failure' || steps.rules_matrix.outcome == 'failure'
        run: |
          echo "فشل أحد أطوار البناء. راجع التعليقات (annotations) أعلاه."
          exit 1

      # عند وجود الملف .ci/publish-demo: يُنشر APK التصحيح كإصدار GitHub باسم «معاينة» ليجده
      # المالك بضغطة واحدة بدل البحث في مرفقات التشغيل. والعلامة تُحذف بعد نجاح النشر.
      # تنبيه: هذا بناء تصحيح (debug) للمعاينة فقط، وليس نسخة توزيع للمستخدمين.
      - name: Publish preview APK as a GitHub release (only when .ci/publish-demo exists)
        if: hashFiles('.ci/publish-demo') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then
            echo "::warning title=PREVIEW::لا يوجد APK لبناه هذا التشغيل؛ تأكد من نجاح طور التجميع."
            exit 0
          fi
          TAG="preview-d2"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$APK#app-debug.apk" \
            --title "معاينة التصميم الجديد — «بيننا» (د١+د٢)" \
            --prerelease \
            --notes "نسخة تصحيح (debug) **للمعاينة فقط**، ليست نسخة توزيع ولا موقّعة بمفتاح الإصدار.
          ما فيها: هوية «بيننا» الجديدة (أيقونة وألوان)، الهيكل الجديد (الرئيسية/غرفي/الحركات/السوق/المزيد)،
          كشف الغرفة مع الإقرار والاعتراض، القيد الجديد والسداد/القبض العام، وحوار جرد الترحيل."

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          retention-days: 14
          if-no-files-found: ignore
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/apk/debug/*.apk
            /tmp/gradle_*.log
